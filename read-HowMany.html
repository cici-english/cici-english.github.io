<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>How Many? 点读游戏</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { width: 100%; height: 100%; background: #1c2b22; overflow: hidden; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }

  #stage {
    position: relative;
    width: 100vw; height: 100vh;
    display: flex; align-items: center; justify-content: center;
  }
  #boardWrap { position: relative; max-width: 100%; max-height: 100%; }
  #board {
    display: block;
    max-width: 100vw; max-height: calc(100vh - 90px);
    width: auto; height: auto;
    user-select: none; -webkit-user-drag: none;
  }

  /* ===== 点击热区 ===== */
  .hot {
    position: absolute;
    cursor: pointer;
    border-radius: 8px;
    transition: background .15s, box-shadow .15s;
  }
  .hot:hover { background: rgba(255, 235, 59, .18); }
  .hot.active {
    background: rgba(255, 235, 59, .22);
    box-shadow: 0 0 0 4px #ffeb3b, 0 0 24px 6px rgba(255, 235, 59, .65);
    animation: pop .35s ease;
  }
  @keyframes pop {
    0%   { transform: scale(1); }
    50%  { transform: scale(1.06); }
    100% { transform: scale(1); }
  }
  .hot.done::after {
    content: "✓";
    position: absolute; right: -6px; top: -10px;
    width: 26px; height: 26px; line-height: 26px;
    background: #4caf50; color: #fff;
    border-radius: 50%; font-size: 16px; font-weight: bold;
    text-align: center;
    box-shadow: 0 2px 4px rgba(0,0,0,.4);
  }

  /* ===== 底部字幕条 ===== */
  #bar {
    position: fixed; left: 0; right: 0; bottom: 0;
    height: 90px;
    background: rgba(0,0,0,.75);
    display: flex; align-items: center; justify-content: center; gap: 18px;
    padding: 0 20px;
    backdrop-filter: blur(4px);
  }
  #caption {
    color: #fff; font-size: 34px; font-weight: 700;
    text-align: center; flex: 1;
    text-shadow: 0 2px 6px rgba(0,0,0,.6);
  }
  #caption .q { color: #ffeb3b; }
  #caption .a { color: #69f0ae; }
  .btn {
    border: none; border-radius: 10px;
    padding: 12px 20px;
    font-size: 18px; font-weight: bold;
    cursor: pointer; white-space: nowrap;
    box-shadow: 0 3px 6px rgba(0,0,0,.4);
  }
  .btn:active { transform: translateY(2px); }
  #replayBtn { background: #ffeb3b; color: #333; }
  #resetBtn  { background: #90a4ae; color: #fff; }

  /* 手机/平板小屏适配 */
  @media (max-width: 640px) {
    #caption { font-size: 20px; }
    #bar { height: 70px; gap: 8px; padding: 0 8px; }
    .btn { padding: 8px 12px; font-size: 14px; }
    #board { max-height: calc(100vh - 70px); }
  }
</style>
</head>

<div id="bar">
  <div id="caption">👆 点击黑板上的图片开始点读</div>
  <button class="btn" id="replayBtn">🔁 重播</button>
  <button class="btn" id="resetBtn">🔄 重新开始</button>
</div>

<script>
/* ============ 数据：16 张卡片（不含 Start / Finish / 炸弹） ============ */
/* l/t/w/h 为相对原图的百分比坐标，已逐张校准 */
const cards = [
  { l:20.35, t:11.76, w: 6.53, h:17.87, n:1, item:"pencil case" },
  { l:29.44, t:12.31, w: 6.88, h:16.67, n:3, item:"eraser"      },
  { l:41.67, t:13.61, w: 5.56, h:16.02, n:1, item:"ruler"       },
  { l:51.39, t:11.76, w: 6.04, h:19.07, n:1, item:"pencil"      },
  { l:62.50, t:12.31, w: 7.43, h:16.67, n:2, item:"ruler"       },
  { l:75.49, t:10.46, w: 9.24, h:19.17, n:3, item:"pencil case" },
  { l: 6.46, t:34.54, w:11.11, h:18.52, n:3, item:"pencil"      },
  { l:25.00, t:34.54, w: 8.33, h:19.81, n:1, item:"eraser"      },
  { l:50.90, t:35.83, w: 7.92, h:16.67, n:4, item:"eraser"      },
  { l:61.60, t:34.54, w:10.62, h:18.52, n:4, item:"pencil"      },
  { l:77.78, t:35.19, w: 8.33, h:16.67, n:3, item:"ruler"       },
  { l: 6.46, t:60.46, w: 8.82, h:21.02, n:3, item:"pencil case" },
  { l:19.44, t:59.91, w: 9.24, h:21.57, n:2, item:"pencil"      },
  { l:36.11, t:58.61, w:11.60, h:19.17, n:2, item:"eraser"      },
  { l:52.78, t:56.20, w:11.11, h:16.67, n:2, item:"pencil case" },
  { l:67.15, t:55.56, w: 9.24, h:18.52, n:4, item:"ruler"       },
];

const NUM_WORDS = { 1:"one", 2:"two", 3:"three", 4:"four" };
const PAUSE_MS = 3000;   // 问句与答案之间的停顿（毫秒）

/* ============ 单复数处理 ============ */
function phrase(n, item) {
  const word = NUM_WORDS[n];
  const noun = (n === 1) ? item : item + "s";   // one pencil case / three pencil cases
  return { noun, text: word + " " + noun };
}

/* ============ 生成热区 ============ */
const wrap = document.getElementById("boardWrap");
const board = document.getElementById("board");
const caption = document.getElementById("caption");
const hotspots = [];

function layout() {
  const rect = board.getBoundingClientRect();
  const wrapRect = wrap.getBoundingClientRect();
  hotspots.forEach(h => h.remove());
  hotspots.length = 0;
  cards.forEach((c, i) => {
    const d = document.createElement("div");
    d.className = "hot";
    d.style.left   = (c.l / 100 * rect.width)  + "px";
    d.style.top    = (c.t / 100 * rect.height) + "px";
    d.style.width  = (c.w / 100 * rect.width)  + "px";
    d.style.height = (c.h / 100 * rect.height) + "px";
    d.style.marginLeft = rect.left - wrapRect.left + "px";
    d.style.marginTop  = rect.top  - wrapRect.top  + "px";
    d.dataset.idx = i;
    if (doneSet.has(i)) d.classList.add("done");
    d.addEventListener("click", () => play(i));
    wrap.appendChild(d);
    hotspots.push(d);
  });
}

/* ============ 语音 ============ */
let replayData = null;
const doneSet = new Set();

function speak(text, cb) {
  if (!("speechSynthesis" in window)) {           // 不支持语音时只走字幕
    if (cb) setTimeout(cb, 1500);
    return;
  }
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "en-US";
  u.rate = 0.8;                                   // 语速放慢，适合低年级
  u.pitch = 1.05;
  const voices = speechSynthesis.getVoices();
  const en = voices.find(v => v.lang.startsWith("en") && /female|zira|samantha|google/i.test(v.name))
          || voices.find(v => v.lang.startsWith("en"));
  if (en) u.voice = en;
  if (cb) u.onend = cb;
  speechSynthesis.speak(u);
}

/* ============ 点读逻辑 ============ */
let playing = false;

function announce(p, done) {
  playing = true;
  caption.innerHTML = '<span class="q">How many ' + p.noun + '?</span>';
  speak("How many " + p.noun + "?", () => {
    setTimeout(() => {
      caption.innerHTML = '<span class="a">' +
        p.text.charAt(0).toUpperCase() + p.text.slice(1) + "!</span>";
      speak(p.text + "!", () => {
        playing = false;
        if (done) done();
      });
    }, PAUSE_MS);
  });
}

function play(i) {
  if (playing) return;
  const c = cards[i];
  const p = phrase(c.n, c.item);

  replayData = p;
  doneSet.add(i);

  hotspots.forEach(h => h.classList.remove("active"));
  const h = hotspots[i];
  h.classList.add("active");
  h.classList.add("done");

  announce(p, () => {
    setTimeout(() => h.classList.remove("active"), 800);
  });
}

/* ============ 按钮 ============ */
document.getElementById("replayBtn").addEventListener("click", () => {
  if (replayData && !playing) announce(replayData);
});

document.getElementById("resetBtn").addEventListener("click", () => {
  if ("speechSynthesis" in window) speechSynthesis.cancel();
  playing = false; replayData = null; doneSet.clear();
  hotspots.forEach(h => h.classList.remove("active", "done"));
  caption.textContent = "👆 点击黑板上的图片开始点读";
});

/* ============ 初始化 ============ */
if ("speechSynthesis" in window) speechSynthesis.onvoiceschanged = () => {};
window.addEventListener("load", layout);
window.addEventListener("resize", layout);
</script>
